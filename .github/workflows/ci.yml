name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # Every uv command below uses the matrix Python, not .python-version.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run --all-extras ruff check .

      - name: Check formatting
        run: uv run --all-extras ruff format --check .

      - name: Run tests
        run: |
          uv run --all-extras python --version
          uv run --all-extras pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Build
        run: uv build

      - name: Check the built package installs and starts
        run: uvx --isolated --from dist/*.whl web3-risk-mcp --version

      - name: Check the web app installs from the package
        run: uvx --isolated --from "$(ls dist/*.whl)[web]" web3-risk-web --help

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t web3-risk-mcp .

      - name: Check the server starts over stdio
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | timeout 20 docker run -i --rm web3-risk-mcp --transport stdio \
            | grep -q '"serverInfo"'

      - name: Build web app image
        run: docker build -f Dockerfile.web -t arc-safe-send .

      - name: Check the web app starts and serves its page
        run: |
          docker run -d --rm --name safe-send -p 10000:10000 arc-safe-send
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:10000/healthz; then
              curl -sf http://127.0.0.1:10000/ | grep -q "Arc Safe Send" && exit 0
            fi
            sleep 1
          done
          docker logs safe-send
          exit 1

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Arc Foundry (checksum pinned)
        run: |
          v=v0.8.0-2
          f=arc-foundry-$v-x86_64-unknown-linux-gnu.tar.gz
          curl -sSLO "https://github.com/circlefin/arc-foundry/releases/download/$v/$f"
          echo "088bdb96a84418b757f9825d491e702792f1d1d1e29a9145af305a6600a79556  $f" | sha256sum -c
          tar -xzf "$f"
          mkdir -p "$HOME/.local/bin"
          mv forge "$HOME/.local/bin/arc-forge"
          mv cast "$HOME/.local/bin/arc-cast"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        working-directory: contracts
        run: arc-forge fmt --check

      - name: Test with standard EVM rules
        working-directory: contracts
        run: arc-forge test

      - name: Test with Arc rules
        working-directory: contracts
        run: FOUNDRY_PROFILE=arc arc-forge test
