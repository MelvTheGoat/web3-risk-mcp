[project]
name = "web3-risk-mcp"
version = "0.1.0"
description = "A read-only MCP server that checks crypto wallets, tokens, and smart contracts for risk."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "MelvTheGoat", email = "melvthegoat@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["mcp", "web3", "ethereum", "security", "risk", "evm", "honeypot", "scam"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
    "mcp>=2.2,<3",
    "pycryptodome>=3.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.urls]
Homepage = "https://github.com/MelvTheGoat/web3-risk-mcp"
Source = "https://github.com/MelvTheGoat/web3-risk-mcp"
Issues = "https://github.com/MelvTheGoat/web3-risk-mcp/issues"
"Risk method" = "https://github.com/MelvTheGoat/web3-risk-mcp/blob/main/docs/risk-method.md"

[project.scripts]
web3-risk-mcp = "web3_risk_mcp.__main__:main"
web3-risk-web = "web3_risk_mcp.web.__main__:main"

[project.optional-dependencies]
web = [
    "fastapi>=0.142",
    "uvicorn>=0.30",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Third-party Solidity libraries (git submodules) are not our code.
extend-exclude = ["contracts/lib"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
