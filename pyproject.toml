[project]
name = "web3-risk-mcp"
version = "0.1.0"
description = "A read-only MCP server that checks crypto wallets, tokens, and smart contracts for risk."
readme = "README.md"
license = "MIT"
authors = [
    { name = "MelvTheGoat", email = "melvthegoat@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["mcp", "web3", "ethereum", "security", "risk", "evm"]
dependencies = [
    "httpx>=0.28",
    "mcp>=2.2,<3",
    "pycryptodome>=3.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.scripts]
web3-risk-mcp = "web3_risk_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
